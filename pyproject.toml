[project]
name = "diffly"
version = "0.1.0"
description = "Dev tool for code review skills on agent codes and PRs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "scalar-fastapi>=1.9.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "node_modules",
    ".next",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (including E302/E303/E305 spacing)
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering & spacing)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
