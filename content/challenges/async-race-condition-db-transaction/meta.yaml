canonical_review: |-
  Senior Staff Engineer Review Critique:
  Performing a check-then-act balance verification across multiple asynchronous Prisma queries without database transaction boundaries is a catastrophic concurrency flaw in financial systems. 

  When two transfer requests arrive within milliseconds of each other, both read the identical initial balance (`$100`), both pass the balance check, and both decrement the wallet sequentially, allowing a user to transfer `$200` from an account holding only `$100`.

  Recommendation:
  Always execute multi-account state mutations inside an atomic transaction: `prisma.$transaction`. Utilize atomic decrement operations with a condition (`UPDATE wallets SET balance = balance - :amount WHERE id = :id AND balance >= :amount`) or row-level pessimistic locking (`SELECT ... FOR UPDATE`).
recommended_fix_diff: |
  --- a/services/wallet.ts
  +++ b/services/wallet.ts
  @@ -18,12 +18,15 @@
  -  const senderWallet = await prisma.wallet.findUnique({
  -    where: { userId: senderId },
  -  });
  -
  -  if (!senderWallet || senderWallet.balance < amount) {
  -    return res.status(400).json({ error: "Insufficient balance" });
  -  }
  -
  -  // Asynchronous audit logging outside atomic boundary
  -  await notifyAuditLog({
  +  await prisma.$transaction(async (tx) => {
  +    const updatedSender = await tx.wallet.updateMany({
  +      where: { userId: senderId, balance: { gte: amount } },
  +      data: { balance: { decrement: amount } },
  +    });
  +    if (updatedSender.count === 0) {
  +      throw new Error("Insufficient balance or concurrent update conflict");
  +    }
  +    await tx.wallet.update({
  +      where: { userId: recipientId },
  +      data: { balance: { increment: amount } },
  +    });
  +  });
