canonical_review: |-
  Senior Staff Engineer Review Critique:
  Separating lockfile checking from lockfile creation is a textbook TOCTOU concurrency flaw (CWE-367). In a multi-process environment, another process can run `os.Create()` immediately after the first process checks `os.Stat()`. Both processes will believe they exclusively hold the lock.

  Recommendation:
  Use OS-level atomic creation flags. Replace `os.Stat` followed by `os.Create` with a single atomic call: `os.OpenFile(l.path, os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0600)`. The `O_EXCL` flag guarantees that file creation succeeds if and only if the file did not already exist, with kernel-level atomicity.
recommended_fix_diff: |
  --- a/lock/process.go
  +++ b/lock/process.go
  @@ -22,12 +22,6 @@
  -	// Step 1: Check if lockfile already exists
  -	_, err := os.Stat(l.path)
  -	if err == nil {
  -		return ErrAlreadyLocked
  -	} else if !os.IsNotExist(err) {
  -		return fmt.Errorf("failed to inspect lockfile status: %w", err)
  -	}
  -
  -	// Step 2: Time-of-Check to Time-of-Use race window.
  -	file, err := os.Create(l.path)
  +	file, err := os.OpenFile(l.path, os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0600)
   	if err != nil {
  +		if os.IsExist(err) {
  +			return ErrAlreadyLocked
  +		}
   		return fmt.Errorf("failed to create lockfile: %w", err)
