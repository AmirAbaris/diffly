canonical_review: |-
  Senior Staff Engineer Review Critique:
  Comparing boxed `Long` identifiers using `!=` or `==` tests JVM object reference identity rather than numeric value equality (CWE-595).

  Java's `Long.valueOf(long)` caches singleton instances for values in `[-128, 127]`. Unit tests using small fixture IDs (`1L`, `42L`, `100L`) receive identical cached `Long` references from both `doc.ownerId()` and `actor.userId()`, so `docOwnerId != requesterId` evaluates to `false` and passes tests. In production, once database sequences or snowflake IDs reach `128` or higher, distinct `Long` objects are allocated on the heap and `docOwnerId != requesterId` evaluates to `true`, erroneously denying legitimate document owners.

  Recommendation:
  Always compare boxed numeric identifiers with `Objects.equals(docOwnerId, requesterId)` (while preserving explicit null checks so two `null` IDs never match) or compare primitive `long` values via `.longValue()`.
recommended_fix_diff: |
  --- a/docs/authz/DocumentAccessGuard.java
  +++ b/docs/authz/DocumentAccessGuard.java
  @@ -3,3 +3,4 @@
   import java.time.Instant;
   import java.util.List;
  +import java.util.Objects;
   import java.util.Optional;
  @@ -34,5 +35,5 @@
           Long docOwnerId = doc.ownerId();
           Long requesterId = actor.userId();
  -        if (docOwnerId == null || docOwnerId != requesterId) {
  +        if (docOwnerId == null || !Objects.equals(docOwnerId, requesterId)) {
               throw new SecurityException("Access denied for document " + documentId);
           }
