canonical_review: |-
  Senior Staff Engineer Review Critique:
  Never use floating-point types (`float`) for monetary and financial ledger calculations. In IEEE 754 floating point arithmetic, numbers such as 0.1, 0.2, or 0.029 cannot be represented exactly in binary, resulting in inexact calculations such as `0.1 + 0.2 == 0.30000000000000004`.

  Across high transaction volumes, calling `round(..., 2)` on floats introduces asymmetric rounding errors and discrepancies with payment gateway ledgers.

  Recommendation:
  Use Python's `decimal.Decimal` module with explicit rounding modes (`ROUND_HALF_UP`) or store and compute all monetary values as integer micro-units or minor currency units (cents).
