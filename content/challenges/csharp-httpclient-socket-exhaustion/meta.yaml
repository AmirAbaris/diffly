canonical_review: |-
  Senior Staff Engineer Review Critique:
  Creating `using var client = new HttpClient { ... }` inside `FetchSpotRateAsync` allocates a new `HttpMessageHandler` and TCP connection pool for every FX lookup. Even though `HttpClient` implements `IDisposable`, disposing it does not immediately free the OS socket—the TCP connection transitions to `TIME_WAIT` (typically 60–240 seconds).

  Under sustained checkout traffic, this pattern exhausts available ephemeral ports and causes cascading `SocketException` outages across the entire service (CWE-400). Conversely, naively hoisting `HttpClient` to a static field without handler rotation can pin stale DNS records.

  Recommendation:
  Inject `IHttpClientFactory` into `FxRateService` (or use a typed client registered with `AddHttpClient<FxRateService>`) and call `httpClientFactory.CreateClient("FxProvider")` without wrapping the factory-managed handler in a per-request `new HttpClient()`. Alternatively, share a singleton `SocketsHttpHandler` configured with `PooledConnectionLifetime`.
recommended_fix_diff: |
  --- a/Services/Pricing/FxRateService.cs
  +++ b/Services/Pricing/FxRateService.cs
  @@ -8,4 +8,4 @@
  -public sealed class FxRateService(Uri providerBaseUri, ILogger<FxRateService> logger)
  +public sealed class FxRateService(IHttpClientFactory httpClientFactory, Uri providerBaseUri, ILogger<FxRateService> logger)
   {
       private static readonly TimeSpan RequestTimeout = TimeSpan.FromSeconds(5);
   
  @@ -24,7 +24,5 @@
   
  -        using var client = new HttpClient
  -        {
  -            Timeout = RequestTimeout,
  -        };
  +        HttpClient client = httpClientFactory.CreateClient("FxProvider");
  +        client.Timeout = RequestTimeout;
   
           using HttpResponseMessage response = await client.GetAsync(endpoint, cancellationToken);
