    hint: Look at lines 34-55. Wrap `Connection`, `PreparedStatement`, and `ResultSet` in `try-with-resources` blocks (`try (Connection conn = ...; PreparedStatement stmt = ...)`) so the JVM closes every handle even when an exception occurs.
canonical_review: |-
  Senior Staff Engineer Review Critique:
  Manually calling `rs.close()`, `stmt.close()`, and `conn.close()` at the end of a method is a classic JDBC resource leak (CWE-404). If `prepareStatement()`, `executeQuery()`, `rs.next()`, or `rs.getBigDecimal()` throws an exception—or if `rs.close()` itself throws—subsequent `close()` statements never execute.

  In production services backed by a connection pool (such as HikariCP), each leaked `Connection` remains checked out until its leak-detection or max-lifetime threshold expires. A burst of transient SQL errors or query timeouts rapidly drains the pool and causes cascading outages across unrelated endpoints.

  Recommendation:
  Always declare `Connection`, `PreparedStatement`, and `ResultSet` inside `try-with-resources` statements. Because all three interfaces extend `AutoCloseable`, the JVM guarantees deterministic reverse-order closure on both normal returns and exception paths.
