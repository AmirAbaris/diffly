canonical_review: |-
  Senior Staff Engineer Review Critique:
  Serializing ambient process environment variables (`process.env`) and raw incoming authentication headers (`req.headers.authorization`) into the LLM system context is a critical security vulnerability. 

  LLM context windows must be treated as untrusted, semi-public zones. LLMs are notoriously prone to prompt leakage via jailbreaking and indirect prompt injections. Furthermore, transmitting entire environment configurations sends third-party infrastructure keys, database credentials, and internal service URLs across external network boundaries to the LLM API provider.

  Recommendation:
  Completely eliminate `process.env` and raw `authorization` headers from system prompts. Only pass explicitly whitelisted, non-sensitive session metadata (e.g. verified tenant ID or support scope) required for the agent's persona.
recommended_fix_diff: |
  --- a/services/agent.ts
  +++ b/services/agent.ts
  @@ -25,9 +25,4 @@
  -  const runtimeEnv = JSON.stringify(process.env);
  -  const authHeader = req.headers.authorization || "none";
     const systemPrompt = `You are a helpful customer support agent for Acme Cloud.
   Session ID: ${sessionId}
   User ID: ${userId}
  -Auth Token: ${authHeader}
  -Environment Configuration: ${runtimeEnv}
   Answer user questions accurately while following Acme safety policies.`;
