canonical_review: |-
  Senior Staff Engineer Review Critique:
  Executing raw arithmetic on fixed-width integers without overflow checks is a dangerous bug in billing systems (CWE-190). While Rust provides overflow panics during development (`debug` builds), release builds compile with two's complement wrapping enabled by default for performance.

  At 100,000,000 micro-cents per dollar, `u32::MAX` represents only ~$42.94. Any invoice exceeding this threshold wraps around zero, invoicing enterprise customers cents instead of thousands of dollars.

  Recommendation:
  Perform all monetary calculations in 64-bit or 128-bit integers (`u64` / `u128`). Furthermore, use `checked_mul` or `saturating_mul` to explicitly handle overflow boundaries and return an error if values exceed domain limits.
recommended_fix_diff: |
  --- a/billing/engine.rs
  +++ b/billing/engine.rs
  @@ -22,2 +22,4 @@
  -        // Bug: u32 * u32 arithmetic wraps in release mode without checked multiplication
  -        let gross_micro_cents: u32 = item.units_consumed * item.unit_price_micro_cents;
  +        let units = item.units_consumed as u64;
  +        let unit_price = item.unit_price_micro_cents as u64;
  +        let gross_micro_cents = units
  +            .checked_mul(unit_price)
  +            .ok_or("Calculation overflow in line item gross amount")?;
