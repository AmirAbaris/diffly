- tier: 2
  title: Vulnerability Class
  hint: This is an asynchronous race condition in React lifecycle management. Responses
    resolving out of sequence corrupt state.
- tier: 3
  title: Line Pointer & Guidance
  hint: 'Lines 16-32: Implement a cleanup return function in `useEffect` using `const
    controller = new AbortController()` passed to `fetch(..., { signal: controller.signal
    })`, or maintain an `isCancelled` flag to discard outdated results.'
canonical_review: |-
  Senior Staff Engineer Review Critique:
  This is a recurring bug in React data fetching: network latency is variable. When a user navigates between challenge A and challenge B, request A may take 300ms while request B takes 80ms. Request B resolves and sets state for challenge B; 220ms later, request A resolves and overwrites state with challenge A's data while the UI indicates challenge B.

  Recommendation:
  Use an `AbortController` to cancel in-flight requests when the component unmounts or before the effect re-runs:
  ```typescript
  useEffect(() => {
    const controller = new AbortController();
    setLoading(true);
    fetch(`/api/challenges/${challengeId}`, { signal: controller.signal })
      .then(res => res.json())
      .then(data => { setChallenge(data); setLoading(false); })
      .catch(err => {
        if (err.name !== 'AbortError') {
          setError(err.message);
          setLoading(false);
        }
      });
    return () => controller.abort();
  }, [challengeId]);
  ```
