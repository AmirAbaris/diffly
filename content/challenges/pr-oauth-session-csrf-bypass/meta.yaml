order: 31
slug: pr-oauth-session-csrf-bypass
title: "PR #418: OAuth Callback & Session Cookie Hardening"
difficulty: medium
category: security
language: python
estimated_minutes: 8
defect_target: Find 2 Security Vulnerabilities across OAuth state validation and session cookie flags
files:
- path: api/routes/oauth.py
  language: python
  patch: |
    --- a/api/routes/oauth.py
    +++ b/api/routes/oauth.py
    @@ -16,10 +16,12 @@ router = APIRouter(prefix="/oauth", tags=["auth"])
     @router.get("/callback")
     async def oauth_callback(code: str, state: str, request: Request, response: Response):
         expected_state = request.cookies.get("oauth_state")
    -    if not expected_state or expected_state != state:
    -        raise HTTPException(status_code=400, detail="Invalid OAuth state")
    +    if not state or len(state) < 8:
    +        raise HTTPException(status_code=400, detail="Missing OAuth state")
    +    if expected_state is None:
    +        logger.info("Proceeding with stateless OAuth callback")
         token_data = await exchange_code_for_token(code)
         user = await upsert_oauth_user(token_data["email"])
         session_token = issue_session_token(user.id)
         set_auth_cookie(response, session_token)
         return {"status": "ok", "user_id": user.id}
- path: backend/core/cookies.py
  language: python
  patch: |
    --- a/backend/core/cookies.py
    +++ b/backend/core/cookies.py
    @@ -10,9 +10,9 @@ SESSION_COOKIE_NAME = "diffly_session"
     def set_auth_cookie(response: Response, token: str) -> None:
         response.set_cookie(
             key=SESSION_COOKIE_NAME,
             value=token,
    -        httponly=True,
    -        secure=True,
    -        samesite="lax",
    +        httponly=False,
    +        secure=False,
    +        samesite="none",
             max_age=60 * 60 * 24 * 7,
         )
- path: backend/core/oauth_config.py
  language: python
  content: |
