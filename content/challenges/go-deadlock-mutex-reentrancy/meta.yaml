canonical_review: |-
  Senior Staff Engineer Review Critique:
  Attempting reentrant lock acquisition with Go's `sync.Mutex` is a fatal concurrency error. Unlike POSIX recursive mutexes or Java's `synchronized`, Go's `sync.Mutex` does not track goroutine ownership and deliberately forbids reentrancy.

  When `Set` acquires `c.mu.Lock()` and subsequently invokes `c.evictOldest()`, the goroutine attempts to acquire the lock again and blocks indefinitely waiting for itself to release it. Any subsequent goroutine attempting to call `Get` or `Set` will also block, creating an application-wide hang.

  Recommendation:
  Separate the public thread-safe API from internal lock-free helpers. Rename `evictOldest` to `evictOldestLocked()` and remove internal locking calls from it, requiring callers to already hold `c.mu`.
recommended_fix_diff: |
  --- a/cache/lru.go
  +++ b/cache/lru.go
  @@ -26,4 +26,2 @@
  -// evictOldest removes the least recently accessed item.
  -func (c *LRUCache) evictOldest() {
  -	c.mu.Lock()
  -	defer c.mu.Unlock()
  +// evictOldestLocked removes the least recently accessed item. Caller must hold c.mu.
  +func (c *LRUCache) evictOldestLocked() {
  @@ -51,2 +49,2 @@
  -		// Call evictOldest while already holding c.mu
  -		c.evictOldest()
  +		c.evictOldestLocked()
