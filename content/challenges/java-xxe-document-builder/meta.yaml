canonical_review: |-
  Senior Staff Engineer Review Critique:
  Instantiating `DocumentBuilderFactory.newInstance()` without hardening parser features exposes the XML ingestion endpoint to XML External Entity (XXE) injection (CWE-611). By default, Java's `DocumentBuilderFactory` allows DTDs and resolves external entities.

  Enforcing a `MAX_XML_BYTES` payload cap does not stop XXE: a tiny `< 1 KB` XML payload containing `<!DOCTYPE foo [ <!ENTITY xxe SYSTEM "file:///etc/passwd"> ]>` or an internal HTTP SSRF URI (`http://169.254.169.254/...`) forces the parser to fetch local files or cloud metadata endpoints and exfiltrate their contents inside parsed invoice fields.

  Recommendation:
  Harden `DocumentBuilderFactory` before calling `newDocumentBuilder()`: enable `XMLConstants.FEATURE_SECURE_PROCESSING`, set `http://apache.org/xml/features/disallow-doctype-decl` to `true`, disable `external-general-entities`, `external-parameter-entities`, and `load-external-dtd`, and set `setXIncludeAware(false)` and `setExpandEntityReferences(false)`.
recommended_fix_diff: |
  --- a/ingest/xml/InvoiceXmlParser.java
  +++ b/ingest/xml/InvoiceXmlParser.java
  @@ -5,4 +5,5 @@
   import java.util.Optional;
  +import javax.xml.XMLConstants;
   import javax.xml.parsers.DocumentBuilder;
   import javax.xml.parsers.DocumentBuilderFactory;
   import javax.xml.parsers.ParserConfigurationException;
  @@ -28,5 +29,12 @@
           DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();
           factory.setNamespaceAware(true);
  +        factory.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
  +        factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
  +        factory.setFeature("http://xml.org/sax/features/external-general-entities", false);
  +        factory.setFeature("http://xml.org/sax/features/external-parameter-entities", false);
  +        factory.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false);
  +        factory.setXIncludeAware(false);
  +        factory.setExpandEntityReferences(false);
   
           DocumentBuilder builder = factory.newDocumentBuilder();
           Document doc = builder.parse(new InputSource(new StringReader(rawXmlPayload)));
