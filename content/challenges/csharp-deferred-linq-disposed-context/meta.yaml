    explanation: Returning an unmaterialized LINQ query (`IEnumerable<InvoiceExportRow>`) from a method with `await using BillingDbContext db` disposes `db` as soon as the method returns (CWE-672). When the caller enumerates the result, EF Core throws `ObjectDisposedException`. Materialize the query inside the `await using` scope with `await ...ToListAsync(cancellationToken)` and return `IReadOnlyList<InvoiceExportRow>`.
hints:
  - tier: 1
    title: Contextual Clue
    hint: Compare the lifetime of `db` with the moment `pendingRows` is actually executed against the database.
  - tier: 2
    title: Vulnerability Class
    hint: LINQ queries use deferred execution; returning an unmaterialized query after an `await using` scope exits causes use-after-disposal (`ObjectDisposedException` / CWE-672) when the caller iterates it.
  - tier: 3
