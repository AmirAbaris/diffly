canonical_review: |-
  Senior Staff Engineer Review Critique:
  `GetPendingInvoicesAsync` opens `BillingDbContext` with `await using` and returns an unmaterialized LINQ `IQueryable` typed as `IEnumerable<InvoiceExportRow>`. Because LINQ uses deferred execution, no SQL query executes inside `GetPendingInvoicesAsync`.

  When the method returns, `db` is disposed immediately (CWE-672). The moment the caller iterates `pendingRows` (for example in a `foreach` loop or JSON serializer), EF Core throws `ObjectDisposedException: Cannot access a disposed context instance`.

  Recommendation:
  Materialize the query before leaving the `await using` scope by calling `await ...ToListAsync(cancellationToken)` and update the method signature to return `Task<IReadOnlyList<InvoiceExportRow>>` so callers know the data is already materialized. (If streaming large exports is truly needed, return `IAsyncEnumerable<InvoiceExportRow>` with an `async` iterator that yields rows while keeping `db` alive.)
recommended_fix_diff: |
  --- a/Services/Billing/BillingExportService.cs
  +++ b/Services/Billing/BillingExportService.cs
  @@ -15,3 +15,3 @@
  -    public async Task<IEnumerable<InvoiceExportRow>> GetPendingInvoicesAsync(
  +    public async Task<IReadOnlyList<InvoiceExportRow>> GetPendingInvoicesAsync(
           string customerCode,
           DateTimeOffset cutoffDate,
  @@ -27,13 +27,14 @@
  -        IEnumerable<InvoiceExportRow> pendingRows = db.Invoices
  +        List<InvoiceExportRow> pendingRows = await db.Invoices
               .AsNoTracking()
               .Where(inv => inv.CustomerCode == customerCode
                   && inv.Status == "Pending"
                   && inv.DueDate <= cutoffDate)
               .OrderBy(inv => inv.DueDate)
               .Select(inv => new InvoiceExportRow(
                   inv.Id,
                   inv.CustomerCode,
                   inv.AmountDue,
  -                inv.DueDate));
  +                inv.DueDate))
  +            .ToListAsync(cancellationToken);
   
           return pendingRows;
