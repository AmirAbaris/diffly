canonical_review: |-
  Senior Staff Engineer Review Critique:
  Verifying the HMAC of a webhook payload without enforcing timestamp freshness creates an immediate replay vulnerability (CWE-294). 

  An attacker or compromised intermediary that observes a valid `payment_intent.succeeded` webhook can replay the exact HTTP payload hours or days later. Because the HMAC signature remains valid against the raw body, the server processes the event again, granting duplicate credits or subscriptions.

  Recommendation:
  1. Validate that `abs(time.time() - int(x_webhook_timestamp)) < 300` seconds (5 minutes tolerance for clock drift).
  2. Bind the timestamp to the signature by signing `f"t={x_webhook_timestamp},{raw_body.decode()}"`.
  3. Store processed webhook event IDs in Redis or database with TTL for idempotency deduplication.
recommended_fix_diff: |
  --- a/webhooks/stripe.py
  +++ b/webhooks/stripe.py
  @@ -24,4 +24,10 @@
           )
   
  +    try:
  +        event_time = int(x_webhook_timestamp)
  +        if abs(time.time() - event_time) > 300:
  +            raise HTTPException(status_code=400, detail="Webhook timestamp expired")
  +    except ValueError:
  +        raise HTTPException(status_code=400, detail="Invalid timestamp header")
  +
  -    expected_sig = hmac.new(
  -        WEBHOOK_SECRET, msg=raw_body, digestmod=hashlib.sha256
  -    ).hexdigest()
  +    signed_payload = f"{event_time}.".encode() + raw_body
  +    expected_sig = hmac.new(
  +        WEBHOOK_SECRET, msg=signed_payload, digestmod=hashlib.sha256
  +    ).hexdigest()
