    explanation: EF Core `DbContext` instances are not thread-safe. Sharing a single request-scoped `AppDbContext` across `Task.WhenAll` starts overlapping async database operations on one context instance, causing `InvalidOperationException` and race conditions (CWE-362). Inject `IDbContextFactory<AppDbContext>` and create an isolated `await using` context per concurrent task (or await the queries sequentially).
