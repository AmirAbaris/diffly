canonical_review: |-
  Senior Staff Engineer Review Critique:
  `CustomerDashboardService` injects a single request-scoped `AppDbContext` and runs `LoadRecentInvoicesAsync` and `LoadRecentAuditEventsAsync` concurrently via `Task.WhenAll`. EF Core's `DbContext` is explicitly not thread-safe—even with `.AsNoTracking()`, both tasks share the same `DbContext` instance and underlying connection state.

  At runtime, this triggers `InvalidOperationException: A second operation was started on this context instance before a previous operation completed` (CWE-362), breaking dashboard loads whenever both queries overlap.

  Recommendation:
  To keep parallel execution safely, inject `IDbContextFactory<AppDbContext>` (registered via `AddDbContextFactory`) and create a dedicated `await using AppDbContext db = await dbFactory.CreateDbContextAsync(ct)` inside each concurrent helper method. Alternatively, if parallel latency isn't required, `await` the two queries sequentially on the scoped context.
recommended_fix_diff: |
  --- a/Services/Dashboard/CustomerDashboardService.cs
  +++ b/Services/Dashboard/CustomerDashboardService.cs
  @@ -18,3 +18,3 @@
  -public sealed class CustomerDashboardService(AppDbContext dbContext)
  +public sealed class CustomerDashboardService(IDbContextFactory<AppDbContext> dbFactory)
   {
       public async Task<CustomerDashboardDto> GetDashboardAsync(
  @@ -35,16 +35,22 @@
  -    private Task<List<InvoiceItem>> LoadRecentInvoicesAsync(Guid customerId, CancellationToken ct) =>
  -        dbContext.Invoices
  +    private async Task<List<InvoiceItem>> LoadRecentInvoicesAsync(Guid customerId, CancellationToken ct)
  +    {
  +        await using AppDbContext db = await dbFactory.CreateDbContextAsync(ct);
  +        return await db.Invoices
               .AsNoTracking()
               .Where(i => i.CustomerId == customerId)
               .OrderByDescending(i => i.IssuedAt)
               .Take(10)
               .ToListAsync(ct);
  +    }
   
  -    private Task<List<AuditEvent>> LoadRecentAuditEventsAsync(Guid customerId, CancellationToken ct) =>
  -        dbContext.AuditEvents
  +    private async Task<List<AuditEvent>> LoadRecentAuditEventsAsync(Guid customerId, CancellationToken ct)
  +    {
  +        await using AppDbContext db = await dbFactory.CreateDbContextAsync(ct);
  +        return await db.AuditEvents
               .AsNoTracking()
               .Where(e => e.CustomerId == customerId)
               .OrderByDescending(e => e.OccurredAt)
               .Take(20)
               .ToListAsync(ct);
  +    }
   }
