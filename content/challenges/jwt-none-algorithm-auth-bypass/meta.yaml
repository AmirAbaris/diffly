canonical_review: |-
  Senior Staff Engineer Review Critique:
  Bypassing signature verification when `alg === "none"` is one of the most famous JWT vulnerabilities in software history (CVE-2015-9235). Any client can craft a token containing `{"sub": "admin", "role": "admin"}` with an empty signature and gain full system access.

  Additionally, calling `jwt.verify(token, PUBLIC_KEY)` without an explicit `algorithms: ["RS256"]` whitelist allows algorithm confusion: an attacker can convert the RSA public key to an HMAC secret, sign the token using `HS256`, and forge valid tokens.

  Recommendation:
  Never trust client-specified algorithm headers. Always pass `{ algorithms: ["RS256"] }` in the verification options to strictly enforce asymmetric signature verification.
recommended_fix_diff: |
  --- a/middleware/auth.ts
  +++ b/middleware/auth.ts
  @@ -27,11 +27,4 @@
  -    const alg = decodedHeader.header.alg;
  -    let verifiedPayload: AuthTokenPayload;
  -
  -    if (alg === "none" || !alg) {
  -      verifiedPayload = decodedHeader.payload as AuthTokenPayload;
  -    } else {
  -      verifiedPayload = jwt.verify(token, PUBLIC_KEY) as AuthTokenPayload;
  -    }
  +    const verifiedPayload = jwt.verify(token, PUBLIC_KEY, {
  +      algorithms: ["RS256"],
  +    }) as AuthTokenPayload;
