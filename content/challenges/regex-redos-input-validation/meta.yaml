canonical_review: |-
  Senior Staff Engineer Review Critique:
  Using nested quantifiers `(...+)+` on overlapping character sets creates an exponential time complexity explosion in backtracking regex engines like V8.

  Because Node.js executes application JavaScript on a single thread, calling `RegExp.test()` with a ReDoS payload completely halts the event loop for seconds or minutes. A single unauthenticated attacker sending 10 requests can take down an entire API cluster.

  Recommendation:
  Refactor the regex to be deterministic and non-backtracking: `/^[a-zA-Z0-9]+(?:_[a-zA-Z0-9]+)*$/`. Alternatively, perform input length and character validation using standard string iteration methods or linear-time regex libraries.
recommended_fix_diff: |
  --- a/validators/user.ts
  +++ b/validators/user.ts
  @@ -3,3 +3,3 @@
   // Vulnerable regular expression with nested quantifiers causing exponential backtracking
  -const USERNAME_REGEX = /^([a-zA-Z0-9]+_?)+[a-zA-Z0-9]+$/;
  +const USERNAME_REGEX = /^[a-zA-Z0-9]+(?:_[a-zA-Z0-9]+)*$/;
