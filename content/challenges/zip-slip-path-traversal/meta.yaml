canonical_review: |-
  Senior Staff Engineer Review Critique:
  Extracting files from an archive using `path.join(destinationDirectory, file.path)` without verifying canonical path containment is vulnerable to the Zip Slip path traversal vulnerability (CWE-22). 

  Attackers can create archives where filenames contain `../../` relative directory traversal elements. When extracted, files are written outside the intended directory, potentially overwriting application binaries, cron jobs, or `.ssh/authorized_keys`.

  Recommendation:
  Always resolve the path using `path.resolve` and check that the resolved destination starts with the resolved target directory prefix before extracting any entry.
recommended_fix_diff: |
  --- a/utils/extractor.ts
  +++ b/utils/extractor.ts
  @@ -21,4 +21,8 @@
       // Construct destination file path from archive entry name
  -    const destinationPath = path.join(destinationDirectory, file.path);
  +    const resolvedRoot = path.resolve(destinationDirectory);
  +    const destinationPath = path.resolve(resolvedRoot, file.path);
  +    if (!destinationPath.startsWith(resolvedRoot + path.sep)) {
  +      throw new Error(`Path traversal attempt detected in entry: ${file.path}`);
  +    }
