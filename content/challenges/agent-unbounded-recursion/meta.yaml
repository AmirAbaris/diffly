canonical_review: |-
  Senior Staff Engineer Review Critique:
  Allowing an autonomous agent to execute tools in an open-ended `while True:` loop without a deterministic loop counter or circuit breaker is an anti-pattern. Autonomous models are susceptible to circular reasoning loops, repeated invocation of failing tools, and prompt injection traps that command perpetual execution. In production, this can burn millions of tokens in minutes, run up substantial API bills, and block worker processes indefinitely.

  Recommendation:
  Always enforce a strict `max_steps` cap (e.g., 10 or 15 iterations) and an overall request deadline. If the limit is reached without a terminal answer, break the loop and return an informative error or partial response.
