  @@ -6,4 +6,5 @@
       def __init__(self, llm_client: Any, tools: dict[str, Any]) -> None:
           self.llm = llm_client
           self.tools = tools
  +        self.max_steps = 15
           self.conversation_history: list[dict[str, str]] = []
  @@ -13,3 +14,3 @@
