canonical_review: |-
  Senior Staff Engineer Review Critique:
  Enabling `TypeNameHandling = TypeNameHandling.Auto` on `Newtonsoft.Json`—especially when paired with `object? Payload` and `MetadataPropertyHandling.ReadAhead`—exposes the agent runtime to critical unsafe deserialization and Remote Code Execution (CWE-502).

  Neither `MaxPayloadBytes` nor `MaxDepth = 32` mitigates this risk: a compact JSON payload containing a malicious `$type` directive (such as `ObjectDataProvider` or `WindowsIdentity` gadget chains) triggers arbitrary type instantiation and code execution inside `JsonConvert.DeserializeObject<AgentCheckpoint>` before the method ever returns.

  Recommendation:
  Disable polymorphic type names by setting `TypeNameHandling = TypeNameHandling.None` and `MetadataPropertyHandling = MetadataPropertyHandling.Ignore` (representing tool payloads as `JsonElement` / `JToken` or explicit DTOs). If polymorphism is strictly required, migrate to `System.Text.Json` with a closed set of `[JsonDerivedType]` attributes or enforce a strict `ISerializationBinder` allowlist containing only known safe DTO types.
recommended_fix_diff: |
  --- a/Agents/Memory/AgentCheckpointSerializer.cs
  +++ b/Agents/Memory/AgentCheckpointSerializer.cs
  @@ -16,6 +16,6 @@
       private static readonly JsonSerializerSettings SerializerSettings = new()
       {
  -        TypeNameHandling = TypeNameHandling.Auto,
  -        MetadataPropertyHandling = MetadataPropertyHandling.ReadAhead,
  +        TypeNameHandling = TypeNameHandling.None,
  +        MetadataPropertyHandling = MetadataPropertyHandling.Ignore,
           MaxDepth = 32,
       };
