canonical_review: |-
  Senior Staff Engineer Review Critique:
  Using Python's standard `pickle` library for persistence or session caching in multi-agent architectures is a critical vulnerability. The official Python documentation explicitly states that `pickle` is not secure against erroneous or maliciously constructed data.

  If Redis is compromised or accessible via SSRF, an adversary can forge a base64-encoded pickle object embedding an `os.system` invocation inside `__reduce__`. When the agent worker restores this checkpoint, the payload executes immediately in the worker process.

  Recommendation:
  Eliminate `pickle` entirely. Serialize state into structured JSON or protobuf models validated by Pydantic. If complex python objects or embeddings are required, store safe primitive dictionaries and re-instantiate classes explicitly.
recommended_fix_diff: |
  --- a/agent/checkpoint.py
  +++ b/agent/checkpoint.py
  @@ -2,2 +2,2 @@
  -import pickle
  +import json
   from typing import Any
  @@ -13,2 +13,2 @@
  -        serialized = pickle.dumps(state_data, protocol=pickle.HIGHEST_PROTOCOL)
  -        b64_payload = base64.b64encode(serialized).decode("utf-8")
  +        payload = json.dumps(state_data)
  +        self.redis.set(f"agent:checkpoint:{session_id}", payload, ex=86400)
  @@ -23,4 +23,2 @@
  -        raw_bytes = base64.b64decode(cached)
  -        # Rehydrate agent execution graph and conversation context
  -        restored_state: dict[str, Any] = pickle.loads(raw_bytes)
  -        return restored_state
  +        return json.loads(cached)
