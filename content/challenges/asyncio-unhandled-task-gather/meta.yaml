canonical_review: |-
  Senior Staff Engineer Review Critique:
  In distributed or parallel agent architectures, partial task failure is a certainty. Using raw `asyncio.gather(*tasks)` without `return_exceptions=True` means that if any task fails, `gather` re-raises that exception immediately. Crucially, python's `asyncio.gather` does NOT cancel running sibling tasks. The 5-second `run_type_checker` task continues running as a zombie coroutine, holding open database connections or compute resources.

  Recommendation:
  In Python 3.11+, use `asyncio.TaskGroup`:
  ```python
  async with asyncio.TaskGroup() as tg:
      t1 = tg.create_task(self.run_linter(repo_path))
      t2 = tg.create_task(self.run_security_scan(repo_path))
      t3 = tg.create_task(self.run_type_checker(repo_path))
  ```
  `TaskGroup` ensures that if one task raises, all other unfinished tasks in the group are automatically cancelled and awaited. Alternatively, if partial results are desired, specify `await asyncio.gather(*tasks, return_exceptions=True)` and inspect each result for `isinstance(r, Exception)`.
recommended_fix_diff: |
  --- a/orchestrator/pipeline.py
  +++ b/orchestrator/pipeline.py
  @@ -22,8 +22,7 @@
  -    async def analyze_repo(self, path: str):
  -        results = await asyncio.gather(*tasks)
  +    async def analyze_repo(self, path: str):
  +        async with asyncio.TaskGroup() as tg:
  +            results = [tg.create_task(t) for t in self.tasks]
           return results
