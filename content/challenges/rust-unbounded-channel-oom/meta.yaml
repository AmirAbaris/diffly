  -    pub fn new() -> (Self, mpsc::UnboundedReceiver<TelemetryEvent>) {
  -        let (tx, rx) = mpsc::unbounded_channel::<TelemetryEvent>();
  +    pub fn new(capacity: usize) -> (Self, mpsc::Receiver<TelemetryEvent>) {
  +        let (tx, rx) = mpsc::channel::<TelemetryEvent>(capacity);
           (Self { sender: tx }, rx)
       }
  @@ -23,4 +23,4 @@
