canonical_review: |-
  Senior Staff Engineer Review Critique:
  Utilizing unbounded channels (`tokio::sync::mpsc::unbounded_channel`) in production network services is an anti-pattern. While convenient because `send()` is synchronous, unbounded queues transfer downstream consumer backpressure risk directly into heap memory exhaustion.

  If the downstream disk writer experiences a 500ms latency stall during an ingestion burst of 50,000 requests/sec, the queue will buffer gigabytes of telemetry payloads until the operating system terminates the process via OOM killer.

  Recommendation:
  Always use bounded channels with explicit capacity (e.g. `mpsc::channel(10_000)`). The producer must either await `send().await` to propagate natural TCP backpressure to clients or return HTTP 429 Too Many Requests when the buffer is saturated.
