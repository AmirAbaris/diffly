canonical_review: |-
  Senior Staff Engineer Review Critique:
  Restoring agent session state from an external store via `ObjectInputStream.readObject()` without an `ObjectInputFilter` is a critical Remote Code Execution vulnerability (CWE-502).

  Note that the `instanceof AgentSessionState` check on line 44 provides zero protection against deserialization attacks: Java invokes `readObject()` hooks, `hashCode()`, and proxy/reflection handlers on every object in the stream *before* `ois.readObject()` returns. An attacker who tampers with a checkpoint token or poisons the backend cache can trigger classpath gadget chains (e.g., Commons Collections, Spring, or JDK gadgets) to execute arbitrary code inside the agent worker.

  Recommendation:
  Long-term, replace Java native serialization with schema-validated JSON (Jackson) or Protocol Buffers. If legacy binary checkpoints must remain supported temporarily, attach a strict `ObjectInputFilter` allowlist (`ois.setObjectInputFilter(...)`) rejecting all classes except `AgentSessionState` and its safe value types, with tight `maxdepth` and `maxbytes` bounds, before calling `readObject()`.
