  hint: 'Look at lines 18-26. Avoid calling `self.session.exec()` inside the loop. Eager load `profile` and `role` relationships using `options(selectinload(...))` or fetch all IDs in bulk using `where(UserProfile.user_id.in_(user_ids))`.'
canonical_review: |-
  Senior Staff Engineer Review Critique:
  Executing individual database queries inside a `for` loop is a quintessential database anti-pattern (the N+1 query problem). Each iteration incurs network latency, serialization overhead, and database connection locking.

  For an organization with 250 members, this single endpoint issues over 500 synchronous database roundtrips, causing API timeouts and connection starvation across the application.

  Recommendation:
  Use SQLAlchemy / SQLModel relationship eager loading (`joinedload` or `selectinload`) on the primary query, or collect all `user_ids` and `role_ids` into sets and perform two bulk queries (`WHERE id IN (...)`) to construct in-memory lookup maps before the loop.
