canonical_review: |-
  Senior Staff Engineer Review Critique:
  Directly interpolating user input `q` into a raw SQL query using Python f-strings is a classic and severe SQL injection vulnerability (CWE-89 / OWASP Top 10 A03:2021). Even when wrapping queries in SQLAlchemy `text()`, the database driver cannot distinguish between code and data if strings are pre-interpolated before reaching the database driver.

  Recommendation:
  Always use bound parameters or the ORM abstraction. For raw SQL, write `:pattern` and pass `{"pattern": f"%{q}%"}` as parameters to `session.execute(query, params)`. Better yet, use SQLModel's type-safe query builder: `session.exec(select(User).where(User.username.contains(q))).all()`.
recommended_fix_diff: |
  --- a/api/routes/users.py
  +++ b/api/routes/users.py
  @@ -15,5 +15,6 @@
  -    q_str = f"SELECT id FROM users WHERE name LIKE '%{q}%'"
  +    q_str = "SELECT id FROM users WHERE name LIKE :p"
       try:
  -        res = session.execute(text(q)).fetchall()
  +        params = {"p": f"%{q}%"}
  +        res = session.execute(text(q), params).fetchall()
