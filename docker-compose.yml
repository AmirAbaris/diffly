services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: diffly-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/diffly.db
      - JWT_SECRET_KEY=diffly-dev-secret-key-change-in-production-only
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000
      - PORT=8000
      - NODE_ENV=production
    volumes:
      - diffly-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      diffly-net:
        aliases:
          - api
          - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: diffly-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      diffly-net:
        aliases:
          - web
          - frontend

volumes:
  diffly-data:

networks:
  diffly-net:
    driver: bridge
