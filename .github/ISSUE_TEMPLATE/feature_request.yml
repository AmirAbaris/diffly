name: Feature request
description: Propose an improvement or new capability for Diffly.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the workflow gap or friction you encountered.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, or UI change you want to add.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any workarounds or other designs you evaluated.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, related issues, or references to existing files.
    validations:
      required: false
