name: CI Code Verification

on:
  push:
    branches: [main, setup/*, feat/*, t3/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Python Formatting & Spacing Check (Ruff)
        run: |
          ruff check api backend tests alembic
          ruff format --check api backend tests alembic

      - name: Python Dependency Vulnerability Check (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Python Unit & API Tests (Pytest + Coverage >= 85%)
        run: |
          pytest tests --cov=api --cov=backend --cov-fail-under=85

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (>= 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Formatting Check (Prettier)
        run: pnpm format:check

      - name: Frontend Fast Lint (Oxlint)
        run: pnpm lint:oxlint

      - name: Frontend React Best Practices (React Doctor)
        run: pnpm lint:doctor

      - name: Frontend Lint (ESLint)
        run: pnpm lint:js

      - name: Check No Verification Screenshots
        run: pnpm lint:screenshots

      - name: Frontend Unit & Component Tests (Vitest)
        run: pnpm test

      - name: Next.js Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (>= 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Suite
        run: pnpm test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
